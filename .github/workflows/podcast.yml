name: Gerar episódio do podcast

on:
  schedule:
    # 05:30 no horário de Brasília (08:30 UTC) — ajuste como quiser
    - cron: "30 8 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  gerar-episodio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg (necessário para juntar os áudios)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline do podcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python main.py

      - name: Commit e push do novo episódio + feed atualizado
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add docs/ data/
          git diff --quiet --cached || git commit -m "Novo episódio: $(date +'%d/%m/%Y')"
          git push
